<app-navbar-two></app-navbar-two>

<div class="about-title" style="background: url('./assets/img/events/background.jpeg'); background-size: cover">
    <div class="d-table">
        <div class="d-table-cell pt-30">
            <div class="title-events text-center">
                <h2 class="title-events">Pavimento Fertile</h2>
                <h1 class="title-events" style="font-size:46px">Jam Session</h1>
            </div>
        </div>
    </div>
</div>

<div class="theory-section theory-style-two">
    <div class="container">
        <div class="row theory-area">
            <div class="col-lg-7">
                <div class="theory-text">
                    <p class="pb-0 mb-0" style="font-size: 1.10rem;"><b><span
                                style="font-size:1.30rem; display:inline-block">Pavimento Fertile Jam Session</span>
                        </b>
                        {{ 'jam-session.description1' | translate}}

                    </p>
                </div>
            </div>

            <div class="theory-img">
                <img src="assets/img/events/JAM.jpg" alt="theory image">
            </div>
        </div>
    </div>
</div>

<div class="video-style-two video-style-three">
    <div class="container-fluid">
        <div class="d-table">
            <div class="d-table-cell">
                <div class="video-text text-center">
                    <a href="https://www.youtube.com/watch?v=yGxD2rCt_2I" class="popup-vimeo"><i
                            class="bx bx-play"></i></a>
                    <p>Watch Video</p>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="blog-section pt-30 pb-30" style="background-color: #bab5b8;">
    <div class="container">
        <div class="about-text">
            <div class="section-title text-center">
                <span style="font-size: 25px;"[innerHTML]="'calendar.upcoming-event' | translate"></span>
            </div>
        </div>
        <div class="row d-flex justify-content-center align-items-center" style="margin-left:5%; margin-right: 5%;">
            <div class="col-lg-3 col-md-5">
                <div class="blog-card">
                    <div class="blog-img">
                        <a target="_blank" href="https://fb.me/e/379CWQ0Eg?ti=wa"><img src="assets/img/calendar/check-the-style.jpg"
                                alt="blog image"></a>
                        <div class="blog-date">
                            <span>12 May</span>
                        </div>
                    </div>

                    <div class="blog-text">
                        <h3>Check The Style</h3>
                        <p>Pre-party Pavimento Fertile</p>
                        <div class="post-info row">
                            <div class="col-6">
                                <ul>
                                    <li><a target="_blank" href="https://fb.me/e/379CWQ0Eg?ti=wa"><i
                                                class="flaticon-facebook"></i></a></li>
                                </ul>
                            </div>
                            <div class="col-6">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>
