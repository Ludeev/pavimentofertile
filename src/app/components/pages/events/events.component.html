<app-navbar-two></app-navbar-two>

<div class="about-title" style="background: url('./assets/img/events/background.jpeg'); background-size: cover">
    <div class="d-table">
        <div class="d-table-cell pt-30">
            <div class="title-events text-center">
                <h2 class="title-events">Pavimento Fertile</h2>
                <h1 class="title-events" style="font-size:46px">Dance and Music Festival</h1>
            </div>
        </div>
    </div>
</div>

<div class="theory-section theory-style-two">
    <div class="container">
        <div class="row theory-area">
            <div class="col-lg-7">
                <div class="theory-text">
                    <p class="pb-0 mb-0" style="font-size: 1.10rem;"><b><span
                                style="font-size:1.30rem; display:inline-block">Pavimento Fertile Dance and Music Festival</span>
                        </b>
                        {{ 'jam-session.description1' | translate}}

                    </p>
                </div>
            </div>

            <div class="theory-img">
                <img src="assets/img/events/JAM.jpg" alt="theory image">
            </div>
        </div>
    </div>
</div>

<div class="video-style-two video-style-three">
    <div class="container-fluid">
        <div class="d-table">
            <div class="d-table-cell">
                <div class="video-text text-center">
                    <a href="https://www.youtube.com/watch?v=_0mSd5CWraE" class="popup-vimeo"><i
                            class="bx bx-play"></i></a>
                    <p>Watch Video</p>
                </div>
            </div>
        </div>
    </div>
</div>

<section style="background: linear-gradient(160deg, #111111 0%, #1e1e1e 60%, #2a1a10 100%); padding: 70px 0;">
    <div class="container">

        <!-- Titolo sezione -->
        <div class="text-center mb-50">
            <p style="color: #df6e49; font-family: 'Montserrat', sans-serif; font-size: 0.85rem;
                       letter-spacing: 4px; text-transform: uppercase; margin-bottom: 12px;">
                <i class="bx bx-film" style="vertical-align: middle; margin-right: 6px;"></i>Guarda i nostri recap
            </p>
            <h2 style="color: #ffffff; font-family: 'Poppins', sans-serif; font-size: 2.2rem;
                        font-weight: 700; margin-bottom: 0; line-height: 1.2;">
                Altri video <span style="color: #df6e49;">di recap</span>
            </h2>
            <div style="width: 60px; height: 3px; background: #df6e49; margin: 16px auto 0; border-radius: 2px;"></div>
        </div>

        <!-- Card video -->
        <div class="d-flex justify-content-center">
            <div class="recap-video-card" style="position: relative; display: inline-block; border-radius: 12px;
                         overflow: hidden; box-shadow: 0 8px 40px rgba(223,110,73,0.25);
                         transition: transform 0.3s ease, box-shadow 0.3s ease; max-width: 680px; width: 100%;">
                <a href="https://www.youtube.com/watch?v=yGxD2rCt_2I" class="popup-vimeo"
                   style="display: block; position: relative;">
                    <img src="https://img.youtube.com/vi/yGxD2rCt_2I/maxresdefault.jpg" alt="Recap video"
                         style="width: 100%; display: block; transition: transform 0.4s ease;">
                    <!-- Overlay scuro gradiente -->
                    <div style="position: absolute; inset: 0;
                                background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.1) 60%);"></div>
                    <!-- Pulsante play -->
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%);
                                width: 80px; height: 80px; border-radius: 50%;
                                background: #df6e49;
                                display: flex; align-items: center; justify-content: center;
                                box-shadow: 0 0 0 10px rgba(223,110,73,0.25);
                                transition: transform 0.3s ease, box-shadow 0.3s ease;">
                        <i class="bx bx-play" style="font-size: 2.8rem; color: #ffffff; margin-left: 6px;"></i>
                    </div>
                    <!-- Label in basso -->
                    <div style="position: absolute; bottom: 18px; left: 20px;">
                        <span style="background: #df6e49; color: #fff; font-family: 'Montserrat', sans-serif;
                                     font-size: 0.75rem; font-weight: 700; letter-spacing: 2px;
                                     text-transform: uppercase; padding: 4px 12px; border-radius: 4px;">
                            Recap
                        </span>
                    </div>
                </a>
            </div>
        </div>

    </div>
</section>
