<app-navbar-two></app-navbar-two>

<div class="about-title" style="background: url('./assets/img/live-show/back-description.jpeg'); background-size: cover">
    <div class="d-table">
        <div class="d-table-cell">
            <div class="title-events text-center">
                <h1 class="title-events">Contact</h1>
            </div>
        </div>
    </div>
</div>

<div class="contact-area contact-section">
    <div class="container">
        <div class="row contact-box d-flex justify-content-center">


            <div class="col-lg-8 p-0">
                <div class="contact-form">
                    <div class="contact-text">
                        <h3>Contact us..</h3>
                    </div>

                    <form id="contactForm">
                        <div class="row">
                            <div class="col-md-12 col-sm-6">
                                <div class="form-group mb-3">
                                    <input type="text" name="name" id="name" class="form-control" placeholder="Name">
                                </div>
                            </div>

                            <div class="col-md-12 col-sm-6">
                                <div class="form-group mb-3">
                                    <input type="email" name="email" id="email" class="form-control" placeholder="Email">
                                </div>
                            </div>

                            <div class="col-md-12 col-sm-6">
                                <div class="form-group mb-3">
                                    <input type="text" name="msg_subject" id="msg_subject" class="form-control" placeholder="Subject">
                                </div>
                            </div>

                            <div class="col-lg-12 col-md-12">
                                <div class="form-group mb-3">
                                    <textarea name="message" class="message-field" id="message" cols="30" rows="5" placeholder="Message"></textarea>
                                </div>
                            </div>

                            <div class="col-lg-12 col-md-12">
                                <button type="submit" class="default-btn contact-btn">Send Message</button>
                            </div>
                        </div>
                    </form>

                    <img src="assets/img/shapes/mailGreen.png" class="contact-shape" alt="shape">
                </div>
            </div>
        </div>
    </div>
</div>
