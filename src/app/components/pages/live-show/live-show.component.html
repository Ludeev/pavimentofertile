<app-navbar-two></app-navbar-two>

<div class="about-title" style="background: url('./assets/img/live-show/background.jpeg'); background-size: cover">
    <div class="d-table">
        <div class="d-table-cell pt-30">
            <div class="title-events text-center">
                <h1 class="title-events">Live Show</h1>
            </div>
        </div>
    </div>
</div>

<div class="liveshow-section liveshow-style-two theory-style-two" style="padding-top:70px">
    <div class="container">
        <div class="row liveshow-area">
            <div class="row d-flex justify-content-center">

                <div class="col-md-4 col-xs-10 justify-contenct-center text-center align-self-center pt-30">
                    <img src="assets/img/live-show/flyer.jpg" class="pl-30" style="width: 100%;">
                </div>
                <div class="col-md-6 col-xs-12 align-self-center">
                    <div class="liveshow-text text-left">
                        <h4 class="mb-0 mt-2">Pavimento Fertile Presents:</h4>
                        <h2 class="mb-0 pb-0" style="font-size:41px"><b>COSMIC HEALING MANTRAS</b></h2>
                        <i [innerHTML]="'live-show.description1' | translate"></i>
                        <p [innerHtml]="'live-show.description2' | translate">

                        </p>
                    </div>
                </div>
            </div>


            <!--            <div class="liveshow-img">
                    <img src="assets/img/liveshow-img.png" alt="liveshow image">
                </div>-->
        </div>
    </div>
</div>

<div class="live-show-video-style video-style-three">
    <div class="container-fluid">
        <div class="d-table">
            <div class="d-table-cell">
                <div class="video-text text-center">
                    <a href="https://www.youtube.com/watch?v=4j6n5M3OKg0" class="popup-vimeo"><i
                            class="bx bx-play"></i></a>
                    <p>Comsic Healing Mantras: Video Promo</p>
                </div>
            </div>
        </div>
    </div>
</div>

<section class="about-section" style="padding-bottom:60px">
    <div class="container">
        <div class="row">
            <div class="container-fluid">
                <ngb-carousel interval="3000">
                    <ng-template ngbSlide *ngFor="let image of images">
                        <div class="picsum-img-wrapper">
                            <img [src]="image" alt="Carousel Photos" class="d-block" style="width:600; height:400px;object-fit: cover;">
                        </div>
                    </ng-template>
                </ngb-carousel>
            </div>
        </div>
    </div>
</section>
